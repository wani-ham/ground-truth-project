name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/argus/package-lock.json

      - name: Install dependencies
        working-directory: apps/argus
        run: npm ci

      - name: Run tests
        working-directory: apps/argus
        run: npm test

      - name: Build ARGUS
        working-directory: apps/argus
        run: npm run build -- --base=/${{ github.event.repository.name }}/argus/

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R apps/argus/dist _site/argus
          cp -R apps/gaia _site/gaia
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=argus/"><title>Ground Truth</title><a href="argus/">Open ARGUS</a> <a href="gaia/">Open GAIA</a>\n' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
